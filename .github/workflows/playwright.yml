name: Playwright Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ── Phase 1: deploy ──────────────────────────────────────────────────────

      - name: Start app
        run: npm start &

      - name: Wait for app to be ready
        run: |
          echo "Waiting for http://localhost:4000/api/v1/health ..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/v1/health > /dev/null; then
              echo "App is up (attempt $i)"
              exit 0
            fi
            echo "  attempt $i/30 — retrying in 1s"
            sleep 1
          done
          echo "App never came up after 30s"
          exit 1

      # ── Phase 2: test ────────────────────────────────────────────────────────

      - name: Run Playwright tests
        run: npm test

      - name: Upload test report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore

      # ── Phase 3: shutdown ────────────────────────────────────────────────────

      - name: Stop app
        if: always()
        run: pkill -f "server/src/index.js" || true
